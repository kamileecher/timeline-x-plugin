      <stop offset="1" stop-color="#0B111A" />
    </linearGradient>
    <linearGradient id="electric-blue" x1="42" y1="256" x2="220" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08C7FF" />
      <stop offset="0.48" stop-color="#078DFF" />
      <stop offset="1" stop-color="#075BFF" />
