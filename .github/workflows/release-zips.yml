# Copied into the public plugin repository by scripts/publish-public-plugin.mjs.
# Edit the source in timeline-x-studio, never in the public repository.
#
# Every v* tag (pushed by publish:plugin on each release) gets a GitHub Release
# with separate, ready-to-install plugin zips:
#   timeline-x-studio-claude-<version>.zip   Claude plugin (also a one-plugin marketplace)
#   timeline-x-studio-codex-<version>.zip    Codex one-plugin marketplace
#   timeline-x-studio-claude.zip / -codex.zip  the same bytes under fixed names, linked by
#     timelinex.studio through releases/latest/download/ so the site always serves the newest
#   SHA256SUMS.txt
name: Release plugin zips

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package, for example v0.2.943'
        required: true

permissions:
  contents: write

concurrency:
  group: release-zips-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: Build Claude and Codex zips
        run: |
          set -euo pipefail
          version="${TAG#v}"
          marketplace=.claude-plugin/marketplace.json
          codex_marketplace=.agents/plugins/marketplace.json
          name=$(jq -r '.plugins[0].name' "$marketplace")
          source=$(jq -r '.plugins[0].source' "$marketplace")
          declared=$(jq -r '.plugins[0].version' "$marketplace")
          if [ "$declared" != "$version" ]; then
            echo "::error::Tag $TAG does not match marketplace version $declared"
            exit 1
          fi
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            test -f "$source/$manifest"
            test "$(jq -r .version "$source/$manifest")" = "$version"
          done
          test "$(jq -r '.plugins[0].source.path' "$codex_marketplace")" = "$source"
          stage="$RUNNER_TEMP/stage"
          mkdir -p dist "$stage/claude" "$stage/codex/plugins" "$stage/codex/.agents/plugins"

          # Claude: the plugin root, which is also its own one-plugin marketplace.
          # Upload it in the Claude app, or unzip and /plugin marketplace add <folder>.
          cp -R "$source/." "$stage/claude/"
          rm -rf "$stage/claude/.codex-plugin" "$stage/claude/.codex.mcp.json"
          jq '.plugins[0].source = "./"' "$marketplace" > "$stage/claude/.claude-plugin/marketplace.json"

          # Codex: a one-plugin local marketplace.
          # Unzip, then codex plugin marketplace add <folder> && codex plugin add.
          cp "$codex_marketplace" "$stage/codex/.agents/plugins/marketplace.json"
          cp -R "$source" "$stage/codex/$source"
          rm -rf "$stage/codex/$source/.claude-plugin" "$stage/codex/$source/.mcp.json"

          for host in claude codex; do
            (cd "$stage/$host" && zip -rqX "$GITHUB_WORKSPACE/dist/$name-$host-$version.zip" . -x '*.DS_Store')
            # Same bytes under a fixed name: releases/latest/download/<name>-<host>.zip
            # always serves the newest plugin, so the website never needs a redeploy.
            cp "dist/$name-$host-$version.zip" "dist/$name-$host.zip"
          done

          # Each zip must carry only its own host's manifest and MCP file.
          # (List first: grep -q on a live pipe would SIGPIPE unzip under pipefail.)
          claude_files=$(unzip -Z1 "dist/$name-claude.zip")
          codex_files=$(unzip -Z1 "dist/$name-codex.zip")
          grep -qx '.claude-plugin/plugin.json' <<< "$claude_files"
          grep -qx '.claude-plugin/marketplace.json' <<< "$claude_files"
          grep -qx '.mcp.json' <<< "$claude_files"
          if grep -q '\.codex' <<< "$claude_files"; then echo "::error::Claude zip carries Codex files"; exit 1; fi
          grep -qx '.agents/plugins/marketplace.json' <<< "$codex_files"
          grep -qx "${source#./}/.codex-plugin/plugin.json" <<< "$codex_files"
          grep -qx "${source#./}/.codex.mcp.json" <<< "$codex_files"
          if grep -qE '(\.claude-plugin/|/\.mcp\.json$)' <<< "$codex_files"; then echo "::error::Codex zip carries Claude files"; exit 1; fi
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Timeline X Studio plugin $VERSION

          **Claude:** \`$NAME-claude-$VERSION.zip\`
          - Claude desktop app: Customize → Plugins → Upload plugin, then pick this zip.
          - Claude Code: unzip it to a folder, then \`/plugin marketplace add <folder>\` and \`/plugin install $NAME@timeline-x\`
          - Or from GitHub: \`/plugin marketplace add ${{ github.repository }}\` then \`/plugin install $NAME@timeline-x\`

          **Codex:** \`$NAME-codex-$VERSION.zip\`
          - Unzip it to a folder, then \`codex plugin marketplace add <folder>\`, \`codex plugin add $NAME@timeline-x\` and \`codex mcp login timeline-x\`
          - Or from GitHub: \`codex plugin marketplace add ${{ github.repository }}\` then \`codex plugin add $NAME@timeline-x\` and \`codex mcp login timeline-x\`

          Always-latest links: https://github.com/${{ github.repository }}/releases/latest/download/$NAME-claude.zip and https://github.com/${{ github.repository }}/releases/latest/download/$NAME-codex.zip

          The plugin connects to the hosted Timeline X MCP server and needs Timeline X Studio running on your computer. \`SHA256SUMS.txt\` lists the checksums.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Drop assets this workflow no longer produces, then replace the rest.
            for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              [ -f "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md --title "Timeline X Studio plugin $VERSION"
          else
            gh release create "$TAG" dist/* --verify-tag --latest \
              --title "Timeline X Studio plugin $VERSION" --notes-file notes.md
          fi
