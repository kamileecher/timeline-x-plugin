# Copied into the public plugin repository by scripts/publish-public-plugin.mjs.
# Edit the source in timeline-x-studio, never in the public repository.
#
# Every v* tag (pushed by publish:plugin on each release) gets a GitHub Release
# with separate, ready-to-install plugin zips:
#   timeline-x-studio-claude-<version>.zip   Claude plugin root, for the Claude app's Upload plugin
#   timeline-x-studio-codex-<version>.zip    Codex plugin root, for the Codex app's Add plugin
#   timeline-x-studio-antigravity-<version>.zip  Antigravity plugin root (manifest in
#     .antigravity-plugin/, servers in mcp_config.json), for installing from a local folder
#   timeline-x-studio-cursor-<version>.zip   Cursor plugin root (.cursor-plugin/ and .cursor.mcp.json),
#     unzipped into ~/.cursor/plugins/local/<name>/
#   timeline-x-studio-muse-<version>.zip     skills/ plus .muse.mcp.json for Muse Code, which has no
#     public plugin format: install the skills with `muse skills install` and merge the MCP block
# Each zip holds exactly one plugin root and no marketplace file: the Codex app
# refuses an archive that also declares a marketplace ("Expected a single plugin
# archive"). CLI users install from the GitHub marketplace instead.
#   timeline-x-studio-claude.zip / -codex.zip / -antigravity.zip / -cursor.zip / -muse.zip  the same bytes under fixed names, linked by
#     timelinex.studio through releases/latest/download/ so the site always serves the newest
#   SHA256SUMS.txt
name: Release plugin zips

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package, for example v0.2.943'
        required: true
      ref:
        description: 'Optional commit or branch to package instead of the tag (same version), e.g. main for a same-version hotfix'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-zips-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || format('refs/tags/{0}', inputs.tag || github.ref_name) }}

      - name: Build Claude, Codex, Antigravity, Cursor and Muse zips
        run: |
          set -euo pipefail
          version="${TAG#v}"
          marketplace=.claude-plugin/marketplace.json
          name=$(jq -r '.plugins[0].name' "$marketplace")
          source=$(jq -r '.plugins[0].source' "$marketplace")
          declared=$(jq -r '.plugins[0].version' "$marketplace")
          if [ "$declared" != "$version" ]; then
            echo "::error::Tag $TAG does not match marketplace version $declared"
            exit 1
          fi
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            test -f "$source/$manifest"
            test "$(jq -r .version "$source/$manifest")" = "$version"
          done
          stage="$RUNNER_TEMP/stage"
          mkdir -p dist "$stage/claude" "$stage/codex" "$stage/antigravity"

          # Claude: the plugin root only.
          cp -R "$source/." "$stage/claude/"
          rm -rf "$stage/claude/.codex-plugin" "$stage/claude/.codex.mcp.json" "$stage/claude/.antigravity-plugin" "$stage/claude/mcp_config.json" "$stage/claude/.cursor-plugin" "$stage/claude/.cursor.mcp.json" "$stage/claude/.muse.mcp.json"

          # Codex: the plugin root only.
          cp -R "$source/." "$stage/codex/"
          rm -rf "$stage/codex/.claude-plugin" "$stage/codex/.mcp.json" "$stage/codex/.antigravity-plugin" "$stage/codex/mcp_config.json" "$stage/codex/.cursor-plugin" "$stage/codex/.cursor.mcp.json" "$stage/codex/.muse.mcp.json"
          # The Codex app rejects a manifest without interface.capabilities; releases
          # built before the generator added it get the same default here.
          codex_manifest="$stage/codex/.codex-plugin/plugin.json"
          jq 'if (.interface.capabilities | type) == "array" then . else .interface.capabilities = ["Interactive", "Read", "Write"] end' \
            "$codex_manifest" > "$codex_manifest.tmp" && mv "$codex_manifest.tmp" "$codex_manifest"

          # Antigravity: the plugin root only. Releases built before the generator
          # added its manifest have none, so they get no Antigravity zip.
          has_antigravity=0
          if [ -f "$source/.antigravity-plugin/plugin.json" ]; then
            test "$(jq -r .version "$source/.antigravity-plugin/plugin.json")" = "$version"
            has_antigravity=1
            cp -R "$source/." "$stage/antigravity/"
            rm -rf "$stage/antigravity/.claude-plugin" "$stage/antigravity/.mcp.json" "$stage/antigravity/.codex-plugin" "$stage/antigravity/.codex.mcp.json" "$stage/antigravity/.cursor-plugin" "$stage/antigravity/.cursor.mcp.json" "$stage/antigravity/.muse.mcp.json"
          fi

          # Cursor: the plugin root only, likewise skipped for older releases.
          has_cursor=0
          if [ -f "$source/.cursor-plugin/plugin.json" ]; then
            test "$(jq -r .version "$source/.cursor-plugin/plugin.json")" = "$version"
            has_cursor=1
            mkdir -p "$stage/cursor"
            cp -R "$source/." "$stage/cursor/"
            rm -rf "$stage/cursor/.claude-plugin" "$stage/cursor/.mcp.json" "$stage/cursor/.codex-plugin" "$stage/cursor/.codex.mcp.json" "$stage/cursor/.antigravity-plugin" "$stage/cursor/mcp_config.json" "$stage/cursor/.muse.mcp.json"
          fi

          # Muse Code: skills and the settings block only; no manifest of any host.
          has_muse=0
          if [ -f "$source/.muse.mcp.json" ]; then
            has_muse=1
            mkdir -p "$stage/muse"
            cp -R "$source/." "$stage/muse/"
            rm -rf "$stage/muse/.claude-plugin" "$stage/muse/.mcp.json" "$stage/muse/.codex-plugin" "$stage/muse/.codex.mcp.json" \
              "$stage/muse/.antigravity-plugin" "$stage/muse/mcp_config.json" "$stage/muse/.cursor-plugin" "$stage/muse/.cursor.mcp.json"
          fi

          hosts="claude codex"
          [ "$has_antigravity" = 1 ] && hosts="$hosts antigravity"
          [ "$has_cursor" = 1 ] && hosts="$hosts cursor"
          [ "$has_muse" = 1 ] && hosts="$hosts muse"
          for host in $hosts; do
            (cd "$stage/$host" && zip -rqX "$GITHUB_WORKSPACE/dist/$name-$host-$version.zip" . -x '*.DS_Store')
            # Same bytes under a fixed name: releases/latest/download/<name>-<host>.zip
            # always serves the newest plugin, so the website never needs a redeploy.
            cp "dist/$name-$host-$version.zip" "dist/$name-$host.zip"
          done

          # Each zip must carry only its own host's manifest and MCP file.
          # (List first: grep -q on a live pipe would SIGPIPE unzip under pipefail.)
          claude_files=$(unzip -Z1 "dist/$name-claude.zip")
          codex_files=$(unzip -Z1 "dist/$name-codex.zip")
          grep -qx '.claude-plugin/plugin.json' <<< "$claude_files"
          grep -qx '.mcp.json' <<< "$claude_files"
          if grep -q '\.codex' <<< "$claude_files"; then echo "::error::Claude zip carries Codex files"; exit 1; fi
          grep -qx '.codex-plugin/plugin.json' <<< "$codex_files"
          grep -qx '.codex.mcp.json' <<< "$codex_files"
          if grep -qE '^(\.claude-plugin/|\.mcp\.json$)' <<< "$codex_files"; then echo "::error::Codex zip carries Claude files"; exit 1; fi
          unzip -p "dist/$name-codex.zip" .codex-plugin/plugin.json | jq -e '.interface.capabilities | type == "array" and length > 0 and all(type == "string")' > /dev/null
          if grep -q '\.antigravity-plugin/\|^mcp_config\.json$' <<< "$claude_files"$'\n'"$codex_files"; then echo "::error::A Claude or Codex zip carries Antigravity files"; exit 1; fi
          antigravity_files=""
          if [ "$has_antigravity" = 1 ]; then
            antigravity_files=$(unzip -Z1 "dist/$name-antigravity.zip")
            grep -qx '.antigravity-plugin/plugin.json' <<< "$antigravity_files"
            grep -qx 'mcp_config.json' <<< "$antigravity_files"
            if grep -qE '^(\.claude-plugin/|\.codex-plugin/|\.mcp\.json$|\.codex\.mcp\.json$)' <<< "$antigravity_files"; then echo "::error::Antigravity zip carries Claude or Codex files"; exit 1; fi
          fi
          if grep -q '\.cursor-plugin/\|^\.cursor\.mcp\.json$' <<< "$claude_files"$'\n'"$codex_files"$'\n'"$antigravity_files"; then echo "::error::A non-Cursor zip carries Cursor files"; exit 1; fi
          cursor_files=""
          if [ "$has_cursor" = 1 ]; then
            cursor_files=$(unzip -Z1 "dist/$name-cursor.zip")
            grep -qx '.cursor-plugin/plugin.json' <<< "$cursor_files"
            grep -qx '.cursor.mcp.json' <<< "$cursor_files"
            if grep -qE '^(\.claude-plugin/|\.codex-plugin/|\.antigravity-plugin/|\.mcp\.json$|\.codex\.mcp\.json$|mcp_config\.json$)' <<< "$cursor_files"; then echo "::error::Cursor zip carries other hosts' files"; exit 1; fi
          fi
          if grep -qx '\.muse\.mcp\.json' <<< "$claude_files"$'\n'"$codex_files"$'\n'"$antigravity_files"$'\n'"$cursor_files"; then echo "::error::A non-Muse zip carries the Muse settings block"; exit 1; fi
          muse_files=""
          if [ "$has_muse" = 1 ]; then
            muse_files=$(unzip -Z1 "dist/$name-muse.zip")
            grep -qx '.muse.mcp.json' <<< "$muse_files"
            grep -q '^skills/.*/SKILL\.md$' <<< "$muse_files"
            if grep -qE '^(\.claude-plugin/|\.codex-plugin/|\.antigravity-plugin/|\.cursor-plugin/|\.mcp\.json$|\.codex\.mcp\.json$|\.cursor\.mcp\.json$|mcp_config\.json$)' <<< "$muse_files"; then echo "::error::Muse zip carries other hosts' files"; exit 1; fi
          fi
          if grep -qE '(^|/)(marketplace\.json)$' <<< "$claude_files"$'\n'"$codex_files"$'\n'"$antigravity_files"$'\n'"$cursor_files"$'\n'"$muse_files"; then echo "::error::A plugin zip carries a marketplace file"; exit 1; fi
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Timeline X Studio plugin $VERSION

          **Claude:** \`$NAME-claude-$VERSION.zip\`
          - Claude desktop app: Customize → Plugins → Upload plugin, then pick this zip.
          - Claude Code: \`/plugin marketplace add ${{ github.repository }}\` then \`/plugin install $NAME@timeline-x\`

          **Codex:** \`$NAME-codex-$VERSION.zip\`
          - Codex app: Plugins → Add → upload this zip.
          - Codex CLI: \`codex plugin marketplace add ${{ github.repository }}\`, \`codex plugin add $NAME@timeline-x\` and \`codex mcp login timeline-x\`

          **Antigravity:** \`$NAME-antigravity-$VERSION.zip\`
          - Antigravity CLI: \`agy plugin install https://github.com/${{ github.repository }}\`, then \`/plugin\` → $NAME → Sign in
          - Or unzip it and use \`/plugin\` → Install from local directory.

          **Cursor:** \`$NAME-cursor-$VERSION.zip\`
          - Unzip it into \`~/.cursor/plugins/local/$NAME/\` and run Developer: Reload Window, or import ${{ github.repository }} into a team marketplace.
          - Sign in: Settings → MCP → plugin-$NAME-timeline-x → Connect.

          **Muse Code:** \`$NAME-muse-$VERSION.zip\`
          - Unzip it, run \`muse skills install <folder> --scope user\` for each folder under \`skills/\`, merge \`.muse.mcp.json\` into \`~/.config/muse/settings.json\`, then \`muse mcp login timeline-x\`. The README has the exact commands.

          Always-latest links: https://github.com/${{ github.repository }}/releases/latest/download/$NAME-claude.zip and https://github.com/${{ github.repository }}/releases/latest/download/$NAME-codex.zip and https://github.com/${{ github.repository }}/releases/latest/download/$NAME-antigravity.zip and https://github.com/${{ github.repository }}/releases/latest/download/$NAME-cursor.zip and https://github.com/${{ github.repository }}/releases/latest/download/$NAME-muse.zip

          The plugin connects to the hosted Timeline X MCP server and needs Timeline X Studio running on your computer. \`SHA256SUMS.txt\` lists the checksums.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Drop assets this workflow no longer produces, then replace the rest.
            for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              [ -f "dist/$asset" ] || gh release delete-asset "$TAG" "$asset" --yes
            done
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md --title "Timeline X Studio plugin $VERSION"
          else
            gh release create "$TAG" dist/* --verify-tag --latest \
              --title "Timeline X Studio plugin $VERSION" --notes-file notes.md
          fi
